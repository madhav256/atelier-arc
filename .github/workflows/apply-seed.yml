name: apply-seed
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "https://tmpfiles.org/dl/wiwCEBr60w3R/seed-new.js" -o backend/src/db/seed.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/db/seed.js
          git commit -m "Sync seed with live catalogue (141 works, 9 genres)"
          git push
